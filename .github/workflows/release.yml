name: Publish VPM Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Pack Package
        run: |
          zip -r "com.moruton.gimmicks-${{ steps.version.outputs.VERSION }}.zip" . -x ".git/*" ".github/*" ".vscode/*" "Tests/*" "obj/*"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: "com.moruton.gimmicks-${{ steps.version.outputs.VERSION }}.zip"
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Update VPM Repository
        run: |
          python3 -c "
          import json, sys, os
          pkg_path = 'package.json'
          idx_path = 'docs/index.json'
          tag_version = '${{ steps.version.outputs.VERSION }}'
          repo_name = '${{ github.event.repository.name }}'
          repo_url = f'https://moruton1119.github.io/{repo_name}/index.json'
          zip_url = f'https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/com.moruton.gimmicks-{tag_version}.zip'
          
          print(f'Updating {idx_path} with version {tag_version}...')
          
          # Load package.json
          with open(pkg_path, 'r') as f: pkg = json.load(f)
          
          # Use tag version as the authoritative version for this release
          pkg['version'] = tag_version
          
          # Load or create index.json
          os.makedirs(os.path.dirname(idx_path), exist_ok=True)
          if os.path.exists(idx_path):
              with open(idx_path, 'r') as f: idx = json.load(f)
          else:
              idx = {}

          # Ensure base metadata
          idx.setdefault('name', 'Moruton Laboratory')
          idx.setdefault('author', 'moruton1119')
          idx['id'] = repo_url
          idx['url'] = repo_url
          if 'packages' not in idx: idx['packages'] = {}
          
          name = pkg['name']
          
          # Ensure package structure exists
          if name not in idx['packages']:
              idx['packages'][name] = {'versions': {}}
          
          # Add/Update version in index.json
          idx_pkg = pkg.copy()
          idx_pkg['url'] = zip_url
          idx['packages'][name]['versions'][tag_version] = idx_pkg
          
          print(f'Adding package {name} version {tag_version}')
          
          # Save updated package.json (without url field)
          with open(pkg_path, 'w') as f:
              json.dump(pkg, f, indent=4)
          print(f'Successfully updated {pkg_path} to version {tag_version}')
          
          # Save updated index.json (docs folder for GitHub Pages)
          os.makedirs('docs', exist_ok=True)
          with open('docs/index.json', 'w') as f:
              json.dump(idx, f, indent=4)
          print('Successfully updated docs/index.json')
          "

      - name: Commit & Push index.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json docs/index.json
          # Check if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update package.json and index.json for release ${{ steps.version.outputs.VERSION }} [skip ci]"
            # Pull latest changes to avoid conflicts
            git pull origin main --rebase
            git push origin HEAD:main
          fi
