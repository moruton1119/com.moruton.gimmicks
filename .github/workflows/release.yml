name: Publish VPM Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Pack Package
        run: |
          # Create a consistent zip file name and exclude unnecessary files
          ZIP_NAME="com.moruton.gimmicks-${{ steps.version.outputs.VERSION }}.zip"
          zip -r "$ZIP_NAME" . -x ".git/*" ".github/*" ".vscode/*" "Tests/*" "obj/*" "*.zip" ".gemini/*"

      - name: Create or Update Release
        uses: softprops/action-gh-release@v1
        with:
          files: "com.moruton.gimmicks-${{ steps.version.outputs.VERSION }}.zip"
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update VPM Repository (Manual JSON Update)
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          VERSION_ZIP="com.moruton.gimmicks-${VERSION}.zip"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${VERSION_ZIP}"
          
          # Read package.json to get metadata
          PACKAGE_NAME=$(jq -r '.name' package.json)
          DISPLAY_NAME=$(jq -r '.displayName' package.json)
          DESCRIPTION=$(jq -r '.description' package.json)
          UNITY_VERSION=$(jq -r '.unity' package.json)
          
          # Update index.json using jq
          jq --arg version "$VERSION" \
             --arg name "$PACKAGE_NAME" \
             --arg displayName "$DISPLAY_NAME" \
             --arg description "$DESCRIPTION" \
             --arg unity "$UNITY_VERSION" \
             --arg url "$RELEASE_URL" \
             '.packages["com.moruton.gimmicks"].versions[$version] = {
               "name": $name,
               "version": $version,
               "displayName": $displayName,
               "description": $description,
               "unity": $unity,
               "vpmDependencies": {},
               "url": $url
             }' index.json > index.json.tmp && mv index.json.tmp index.json
          
          # Sync to docs/index.json for redundancy
          if [ -d "docs" ]; then
            cp index.json docs/index.json
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: "chore: update index.json for version ${{ steps.version.outputs.VERSION }} [skip ci]"
