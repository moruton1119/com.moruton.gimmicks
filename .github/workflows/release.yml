name: Publish VPM Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main # Ensure we are on main to push changes back

      - name: Extract Version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Pack Package
        run: |
          # Create a consistent zip file name and exclude unnecessary files
          ZIP_NAME="com.moruton.gimmicks-${{ steps.version.outputs.VERSION }}.zip"
          zip -r "$ZIP_NAME" . -x ".git/*" ".github/*" ".vscode/*" "Tests/*" "obj/*" "*.zip" "old_release.yml" ".gemini/*"

      - name: Create or Update Release
        uses: softprops/action-gh-release@v1
        with:
          files: "com.moruton.gimmicks-${{ steps.version.outputs.VERSION }}.zip"
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install vrc-get
        run: |
          curl -sL https://github.com/vrc-get/vrc-get/releases/latest/download/x86_64-unknown-linux-musl-vrc-get -o vrc-get
          chmod +x vrc-get

      - name: Update VPM Repository
        run: |
          VERSION_ZIP="com.moruton.gimmicks-${{ steps.version.outputs.VERSION }}.zip"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$VERSION_ZIP"
          
          # Update root index.json
          ./vrc-get repo add-package "$VERSION_ZIP" --repo-json index.json --url "$RELEASE_URL"
          
          # Sync to docs/index.json for GitHub Pages (main/docs setup)
          if [ -d "docs" ]; then
            cp index.json docs/index.json
          fi

      - name: Commit and Push index.json changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.json
          if [ -d "docs" ]; then git add docs/index.json; fi
          git commit -m "chore: update index.json for version ${{ steps.version.outputs.VERSION }} [skip ci]" || echo "No changes to commit"
          git push origin main
