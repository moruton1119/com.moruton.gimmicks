name: Publish VPM Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. バージョン情報の抽出 (タグ名 v1.0.0 から 1.0.0 を取得)
      - name: Extract Version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      # 2. パッケージのZip作成
      - name: Pack Package
        run: |
          # 必要なファイルだけをzipにまとめる (除外設定は適宜調整)
          zip -r package.zip . -x ".git/*" ".github/*" ".vscode/*" "Tests/*" "obj/*" "*.meta"
          # ※ .metaファイル除外は誤りでした。Unityパッケージには.metaが必須なので含めます。
          # 正しいコマンドで上書きします
          rm package.zip
          zip -r package.zip . -x ".git/*" ".github/*" ".vscode/*" "Tests/*" "obj/*"

      # 3. GitHub Release の作成 & Zipアップロード
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: package.zip
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }} # ハイフンがあれば自動でプレリリース扱いに

      # 4. VCC用カタログ(index.json) の更新 & GitHub Pages公開
      # vrc-get (VRChat用非公式CLI) を手動でインストールして使用
      - name: Install vrc-get
        run: |
          curl -sL https://github.com/anatawa12/vrc-get/releases/latest/download/vrc-get-x86_64-unknown-linux-musl -o vrc-get
          chmod +x vrc-get

      - name: Update VPM Repository
        run: |
          ./vrc-get repo add-package package.json --repo-json index.json --url https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/package.zip

      # 5. 更新された index.json を gh-pages ブランチにデプロイ
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          keep_files: true # index.json以外を消さないように
