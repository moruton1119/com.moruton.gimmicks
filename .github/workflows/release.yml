name: Publish VPM Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Pack Package
        run: |
          # Create a consistent zip file name and exclude unnecessary files
          ZIP_NAME="com.moruton.gimmicks-${{ steps.version.outputs.VERSION }}.zip"
          zip -r "$ZIP_NAME" . -x ".git/*" ".github/*" ".vscode/*" "Tests/*" "obj/*" "*.zip" ".gemini/*"

      - name: Create or Update Release
        uses: softprops/action-gh-release@v1
        with:
          files: "com.moruton.gimmicks-${{ steps.version.outputs.VERSION }}.zip"
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install vrc-get (Pinned Version)
        run: |
          # Pinning to v0.2.0 to ensure compatible CLI commands (repo add-package)
          curl -sL https://github.com/vrc-get/vrc-get/releases/download/v0.2.0/x86_64-unknown-linux-musl-vrc-get -o vrc-get
          chmod +x vrc-get

      - name: Update VPM Repository
        run: |
          VERSION_ZIP="com.moruton.gimmicks-${{ steps.version.outputs.VERSION }}.zip"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$VERSION_ZIP"
          
          # Use 'repo add-package' command compatible with v0.x
          ./vrc-get repo add-package package.json --repo-json index.json --url "$RELEASE_URL"
          
          # Sync to docs/index.json for redundancy
          if [ -d "docs" ]; then
            cp index.json docs/index.json
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: "chore: update index.json for version ${{ steps.version.outputs.VERSION }} [skip ci]"
